<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse X The Revival</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                linear-gradient(rgba(255, 140, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .page { position: relative; z-index: 1; }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            color: #ff8c00;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255, 140, 0, 0.3);
            margin-bottom: 8px;
        }

        .hero .tagline {
            font-size: 14px;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .hero .get-key-btn {
            display: inline-block;
            background: #ff8c00;
            color: #fff;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.3);
        }

        .hero .get-key-btn:hover {
            background: #ff9e20;
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 140, 0, 0.4);
        }

        .hero .get-key-btn:active { transform: translateY(0); }

        /* ===== SECTIONS ===== */
        .section {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ff8c00;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .section-subtitle {
            font-size: 12px;
            color: #555;
            margin-bottom: 20px;
        }

        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #2a2a3a, transparent);
            margin-bottom: 24px;
        }

        /* ===== CARDS ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .card {
            background: #12121a;
            border: 1px solid #1e1e2a;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            border-color: #ff8c0040;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.08);
        }

        .card-accent {
            height: 2px;
            background: linear-gradient(90deg, #ff8c00, #ff600080);
        }

        .card-body { padding: 16px; }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card-name {
            font-size: 15px;
            font-weight: 700;
            color: #eee;
        }

        .card-version {
            font-size: 10px;
            font-weight: 600;
            color: #ff8c00;
            background: #ff8c0018;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        .card-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tag {
            font-size: 10px;
            color: #aaa;
            background: #1a1a24;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .card-loadstring {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0d0d14;
            border: 1px solid #1a1a24;
            border-radius: 6px;
            padding: 8px 10px;
        }

        .ls-text {
            flex: 1;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 10px;
            color: #666;
            word-break: break-all;
            user-select: all;
            line-height: 1.3;
        }

        .ls-copy {
            background: #2a2a3a;
            border: none;
            color: #aaa;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .ls-copy:hover { background: #3a3a4a; color: #ddd; }
        .ls-copy.copied { background: #4CAF50; color: #fff; }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 30px 20px 40px;
            font-size: 11px;
            color: #333;
        }

        @media (max-width: 640px) {
            .hero h1 { font-size: 24px; letter-spacing: 2px; }
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Hero -->
        <div class="hero">
            <h1>SYNAPSE X THE REVIVAL</h1>
            <div class="tagline">Roblox Script Collection by pebbleford</div>
            <a href="getkey.html" class="get-key-btn">GET KEY</a>
        </div>

        <!-- Game Hubs -->
        <div class="section">
            <div class="section-title">Game Hubs</div>
            <div class="section-subtitle">Requires a key — get one free above</div>
            <div class="section-divider"></div>
            <div class="cards" id="hubCards"></div>
        </div>

        <!-- Standalone -->
        <div class="section">
            <div class="section-title">Standalone Scripts</div>
            <div class="section-subtitle">No key required</div>
            <div class="section-divider"></div>
            <div class="cards" id="standaloneCards"></div>
        </div>

        <div class="footer">Synapse X The Revival &copy; 2024-2026</div>
    </div>

    <script>
        var BASE = "https://raw.githubusercontent.com/pebbleford/roblox-scripts/main/";

        var hubs = [
            {
                name: "Synapse X Admin Hub",
                version: "v3.0",
                file: "synapsex.lua",
                desc: "Universal admin hub — works in any Roblox game",
                tags: ["Speed", "Fly", "Noclip", "God Mode", "ESP", "Aimbot", "Triggerbot", "Hitbox Expander", "Fling", "FE Invisible", "Anti-AFK", "Car Mods", "Emotes"]
            },
            {
                name: "RIVALS FPS Hub",
                version: "v1.4",
                file: "rivals.lua",
                desc: "Competitive FPS hub built for RIVALS",
                tags: ["Aimbot", "Triggerbot", "FOV Circle", "Kill Aura", "ESP", "Chams", "Hitbox Expander", "Bunny Hop", "Speed", "Fly", "Noclip"]
            },
            {
                name: "Murder Mystery 2 Hub",
                version: "v1.1",
                file: "mm2.lua",
                desc: "Full exploit hub for Murder Mystery 2",
                tags: ["Role Detection", "Murderer ESP", "Auto Shoot", "Coin Farm", "Gun ESP", "Kill All", "X-Ray", "Auto Grab Gun"]
            },
            {
                name: "Brookhaven Hub",
                version: "v1.0",
                file: "brookhaven.lua",
                desc: "Exploit hub for Brookhaven RP",
                tags: ["Speed", "Fly", "Noclip", "God Mode", "Teleport", "Game Features"]
            },
            {
                name: "SharkBite 2 Hub",
                version: "v1.0",
                file: "sharkbite.lua",
                desc: "Exploit hub for SharkBite 2",
                tags: ["Speed", "Fly", "Noclip", "God Mode", "Game Features"]
            },
            {
                name: "NBTF Hub",
                file: "nbtf.lua",
                desc: "Hub for Nuclear Blast Testing Facility",
                tags: ["Game Features", "Movement Suite"]
            },
            {
                name: "Elected Hub",
                file: "elected.lua",
                desc: "Hub for Elected",
                tags: ["Game Features", "Movement Suite"]
            },
            {
                name: "99 Nights Hub",
                file: "99nights.lua",
                desc: "Hub for 99 Nights in the Forest",
                tags: ["Game Features", "Movement Suite"]
            }
        ];

        var standalones = [
            {
                name: "DOORS Auto A-1000",
                file: "doors_rooms.lua",
                desc: "Auto-walks to room A-1000 in DOORS: The Rooms, hides from entities",
                tags: ["Pathfinding", "Auto-Hide", "Entity Detection", "A-60/A-120"]
            },
            {
                name: "Spin Fling",
                file: "spinfling.lua",
                desc: "Standalone spin fling — launch other players",
                tags: ["Fling", "Physics"]
            },
            {
                name: "ESP Loader",
                file: "esp.lua",
                desc: "Standalone ESP for any game",
                tags: ["ESP", "Highlights", "Nametags"]
            },
            {
                name: "Steal a Brainrot",
                file: "stealabrainrot.lua",
                desc: "Script for Steal a Brainrot",
                tags: ["Game Features"]
            },
            {
                name: "SAB Admin",
                file: "stealabrainrot-admin.lua",
                desc: "Admin panel for Steal a Brainrot",
                tags: ["Admin", "Defense"]
            },
            {
                name: "Loader",
                file: "loader.lua",
                desc: "Universal script loader",
                tags: ["Loader"]
            }
        ];

        function createCard(data) {
            var loadstring = 'loadstring(game:HttpGet("' + BASE + data.file + '"))()';

            var tagsHtml = '';
            if (data.tags) {
                for (var i = 0; i < data.tags.length; i++) {
                    tagsHtml += '<span class="tag">' + data.tags[i] + '</span>';
                }
            }

            var versionHtml = data.version
                ? '<span class="card-version">' + data.version + '</span>'
                : '';

            var id = 'ls-' + data.file.replace(/[^a-z0-9]/g, '');

            return '<div class="card">' +
                '<div class="card-accent"></div>' +
                '<div class="card-body">' +
                    '<div class="card-header">' +
                        '<span class="card-name">' + data.name + '</span>' +
                        versionHtml +
                    '</div>' +
                    '<div class="card-desc">' + data.desc + '</div>' +
                    '<div class="card-tags">' + tagsHtml + '</div>' +
                    '<div class="card-loadstring">' +
                        '<span class="ls-text" id="' + id + '">' + escapeHtml(loadstring) + '</span>' +
                        '<button class="ls-copy" onclick="copyLS(\'' + id + '\', this)">COPY</button>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function copyLS(id, btn) {
            var el = document.getElementById(id);
            if (!el) return;
            var text = el.textContent;

            navigator.clipboard.writeText(text).then(function() {
                btn.textContent = 'COPIED!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = 'COPY';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(function() {
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = 'COPIED!';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = 'COPY';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // Render cards
        var hubHtml = '';
        for (var i = 0; i < hubs.length; i++) hubHtml += createCard(hubs[i]);
        document.getElementById('hubCards').innerHTML = hubHtml;

        var saHtml = '';
        for (var i = 0; i < standalones.length; i++) saHtml += createCard(standalones[i]);
        document.getElementById('standaloneCards').innerHTML = saHtml;
    </script>
</body>
</html>
